# Builds the site and publishes the ready files (dist/) to the "hostinger" branch.
# Hostinger (hPanel → Advanced → Git) deploys that branch into public_html, and its
# Auto Deployment webhook makes every push here go live in a minute or two.
name: Build for Hostinger

on:
  push:
    branches:
      - main
      - claude/figma-web-design-recreation-59n7u2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publish dist/ to the hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Site build from ${{ github.sha }}"
