<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Me Gusta — hip hop šokių studija Kaune. Gatvės šokiai, Pop Dance, Lady Class ir Breikas." />
    <meta name="theme-color" content="#F4F3EF" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // The public site is light only; the admin keeps its own look.
      if (!/^\/(adminas|apzvalga)/.test(location.pathname)) document.documentElement.dataset.theme = 'light'
    </script>
    <title>Me Gusta — Hip hop šokių studija Kaune</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Šiai svetainei reikia įjungto JavaScript.</noscript>
    <script>
      // If a script or stylesheet fails to load, say which one instead of leaving a blank page.
      window.addEventListener('error', function (e) {
        var t = e.target
        if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return
        var root = document.getElementById('root')
        // (index.php may pre-fill #root with a [data-prerender] copy of the article for search engines)
        if (root && (!root.childElementCount || root.firstElementChild.hasAttribute('data-prerender'))) {
          root.innerHTML = '<p style="font:16px/1.5 system-ui,sans-serif;color:#111;background:#F4F3EF;padding:24px;margin:0">Nepavyko įkelti failo: ' + (t.src || t.href) + '<br>Patikrinkite, ar aplankas <b>assets</b> įkeltas šalia index.html.</p>'
        }
      }, true)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
